name: Documentation

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - '.markdownlint*'
      - 'mkdocs.yml'
      - 'scripts/check-docs.sh'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - '.markdownlint*'
      - 'mkdocs.yml'
      - 'scripts/check-docs.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_READ_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install markdown tooling
        run: |
          npm install -g markdownlint-cli@0.41.0
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material

      - name: Run repo docs checks
        shell: bash
        run: bash scripts/check-docs.sh

      - name: Prepare tracked Markdown inputs
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          import subprocess
          from pathlib import Path

          tracked = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "*.md"]
          )
          paths = [item for item in tracked.split(b"\0") if item]
          if not paths:
              raise SystemExit("No tracked Markdown files found")
          if any(b"\n" in item or b"\r" in item for item in paths):
              raise SystemExit("Newline-containing filenames are unsupported")
          manifest = Path(os.environ["RUNNER_TEMP"]) / "aetherag-markdown-inputs.txt"
          manifest.write_bytes(b"".join(b"./" + item + b"\n" for item in paths))
          print(f"Prepared {len(paths)} tracked Markdown inputs")
          PYTHON

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          lycheeVersion: v0.24.2
          args: >-
            --verbose
            --no-progress
            --accept 200,206,301,302,303,403,429
            --exclude-path .build
            --exclude-path node_modules
            --exclude-path .git
            --files-from "${{ runner.temp }}/aetherag-markdown-inputs.txt"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
