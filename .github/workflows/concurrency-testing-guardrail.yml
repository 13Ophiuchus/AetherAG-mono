name: Concurrency & Testing Guardrail

on:
  pull_request:
  push:
    branches: [main]

jobs:
  guardrail:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.AETHERAG_PAT }}
      - name: Select Xcode
        run: |
          # Pin to Xcode 16.4 (bundles Swift 6.3)
          sudo xcode-select -s /Applications/Xcode_16.4.app
          swift --version
      - name: Run guardrail
        run: scripts/guardrail_testing_concurrency.sh
