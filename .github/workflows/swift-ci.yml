name: Swift CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: swift-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # AGWallet — macOS only (uses Secure Enclave / Apple crypto APIs)
  # ─────────────────────────────────────────────────────────────────
  agwallet:
    name: AGWallet · Build & Test
    runs-on: macos-15

    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.AETHERAG_PAT }}

      - name: Select Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          sudo xcode-select -s "${LATEST:-/Applications/Xcode.app}"
          swift --version

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            AGWallet/.build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: spm-agwallet-${{ runner.os }}-${{ hashFiles('AGWallet/Package.resolved') }}
          restore-keys: spm-agwallet-${{ runner.os }}-

      - name: Resolve dependencies
        working-directory: AGWallet
        run: swift package resolve

      - name: Build (strict concurrency)
        working-directory: AGWallet
        run: |
          swift build -Xswiftc -strict-concurrency=complete 2>&1 \
            | grep -v "^/.*solana-swift-patched\|^/.*web3swift-patched" || true
          swift build -Xswiftc -strict-concurrency=complete

      - name: Test (XUnit output)
        id: agwallet_test
        working-directory: AGWallet
        run: |
          mkdir -p .test-results
          swift test --parallel \
            --xunit-output .test-results/agwallet.xml \
            2>&1 | tee .test-results/agwallet-raw.log
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agwallet-test-results
          path: AGWallet/.test-results/
          retention-days: 14

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: AGWallet Tests
          path: AGWallet/.test-results/agwallet.xml
          reporter: java-junit
          fail-on-error: false

      - name: Emit job summary
        if: always()
        working-directory: AGWallet
        run: |
          echo "## 🔐 AGWallet Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f .test-results/agwallet-raw.log ]; then
            PASSED=$(grep -c "Test Case.*passed" .test-results/agwallet-raw.log || echo 0)
            FAILED=$(grep -c "Test Case.*failed" .test-results/agwallet-raw.log || echo 0)
            TOTAL=$((PASSED + FAILED))
            echo "| Result | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | ${PASSED} / ${TOTAL} |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | ${FAILED} / ${TOTAL} |" >> $GITHUB_STEP_SUMMARY
            if [ "$FAILED" -gt 0 ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Failed Tests" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep "Test Case.*failed" .test-results/agwallet-raw.log >> $GITHUB_STEP_SUMMARY || true
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Fail job if tests failed
        if: steps.agwallet_test.outcome == 'failure'
        run: exit 1

  # ─────────────────────────────────────────────────────────────────
  # AetherAG — Linux (Vapor/Fluent backend)
  # ─────────────────────────────────────────────────────────────────
  aether-linux:
    name: AetherAG · Linux Build & Test
    runs-on: ubuntu-latest

    permissions:
      checks: write
      pull-requests: write
      contents: read
    container:
      image: swift:6.2

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vapor_username
          POSTGRES_PASSWORD: vapor_password
          POSTGRES_DB: vapor_database
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://vapor_username:vapor_password@postgres:5432/vapor_database

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.AETHERAG_PAT }}

      - name: Cache SPM (Linux)
        uses: actions/cache@v4
        with:
          path: |
            AetherAG/.build
            ~/.cache/org.swift.swiftpm
          key: spm-aether-linux-${{ hashFiles('AetherAG/Package.resolved') }}
          restore-keys: spm-aether-linux-

      - name: Resolve dependencies
        working-directory: AetherAG
        run: swift package resolve

      - name: Build
        working-directory: AetherAG
        run: swift build --configuration debug

      - name: Test — all suites (XUnit output)
        id: aether_linux_test
        working-directory: AetherAG
        run: |
          mkdir -p .test-results
          swift test --parallel \
            --xunit-output .test-results/aether-linux.xml \
            2>&1 | tee .test-results/aether-linux-raw.log
        continue-on-error: true

      - name: Wait for Postgres to be ready
        run: |
          for i in $(seq 1 10); do
            pg_isready -h postgres -U vapor_username -d vapor_database && break
            echo "Waiting for postgres... $i/10"
            sleep 3
          done

      - name: Test — Persistence / Issuance (XUnit output)
        id: aether_linux_persistence_test
        working-directory: AetherAG
        run: |
          swift test --filter PersistenceIssuanceTests --parallel \
            --xunit-output .test-results/aether-linux-persistence.xml \
            2>&1 | tee -a .test-results/aether-linux-raw.log
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-linux-test-results
          path: AetherAG/.test-results/
          retention-days: 14

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: AetherAG Linux Tests
          path: AetherAG/.test-results/aether-linux*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Emit job summary
        if: always()
        working-directory: AetherAG
        run: |
          echo "## 🌐 AetherAG Linux (Vapor) Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f .test-results/aether-linux-raw.log ]; then
            PASSED=$(grep -c "Test Case.*passed" .test-results/aether-linux-raw.log || echo 0)
            FAILED=$(grep -c "Test Case.*failed" .test-results/aether-linux-raw.log || echo 0)
            TOTAL=$((PASSED + FAILED))
            echo "| Result | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | ${PASSED} / ${TOTAL} |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | ${FAILED} / ${TOTAL} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Suites run:** All · PersistenceIssuanceTests" >> $GITHUB_STEP_SUMMARY
            if [ "$FAILED" -gt 0 ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Failed Tests" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep "Test Case.*failed" .test-results/aether-linux-raw.log >> $GITHUB_STEP_SUMMARY || true
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Fail job if tests failed
        if: >
          steps.aether_linux_test.outcome == 'failure' ||
          steps.aether_linux_persistence_test.outcome == 'failure'
        run: exit 1

  # ─────────────────────────────────────────────────────────────────
  # AetherAG — macOS (client + server, needs AGWallet green first)
  # ─────────────────────────────────────────────────────────────────
  aether-macos:
    name: AetherAG · macOS Build & Test
    runs-on: macos-15
    needs: agwallet

    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.AETHERAG_PAT }}

      - name: Select Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          sudo xcode-select -s "${LATEST:-/Applications/Xcode.app}"
          swift --version

      - name: Cache SPM (macOS)
        uses: actions/cache@v4
        with:
          path: |
            AetherAG/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-aether-macos-${{ runner.os }}-${{ hashFiles('AetherAG/Package.resolved') }}
          restore-keys: spm-aether-macos-${{ runner.os }}-

      - name: Resolve dependencies
        working-directory: AetherAG
        run: swift package resolve

      - name: Build
        working-directory: AetherAG
        run: swift build --configuration debug

      - name: Test (XUnit output)
        id: aether_macos_test
        working-directory: AetherAG
        run: |
          mkdir -p .test-results
          swift test --parallel \
            --xunit-output .test-results/aether-macos.xml \
            2>&1 | tee .test-results/aether-macos-raw.log
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-macos-test-results
          path: AetherAG/.test-results/
          retention-days: 14

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: AetherAG macOS Tests
          path: AetherAG/.test-results/aether-macos.xml
          reporter: java-junit
          fail-on-error: false

      - name: Emit job summary
        if: always()
        working-directory: AetherAG
        run: |
          echo "## 🍎 AetherAG macOS Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f .test-results/aether-macos-raw.log ]; then
            PASSED=$(grep -c "Test Case.*passed" .test-results/aether-macos-raw.log || echo 0)
            FAILED=$(grep -c "Test Case.*failed" .test-results/aether-macos-raw.log || echo 0)
            TOTAL=$((PASSED + FAILED))
            echo "| Result | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | ${PASSED} / ${TOTAL} |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | ${FAILED} / ${TOTAL} |" >> $GITHUB_STEP_SUMMARY
            if [ "$FAILED" -gt 0 ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Failed Tests" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep "Test Case.*failed" .test-results/aether-macos-raw.log >> $GITHUB_STEP_SUMMARY || true
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Fail job if tests failed
        if: steps.aether_macos_test.outcome == 'failure'
        run: exit 1

  # ─────────────────────────────────────────────────────────────────
  # Secret scanning (TruffleHog — verified secrets only)
  # ─────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified
