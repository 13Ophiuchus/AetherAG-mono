name: Swift CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: swift-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────
  # AGWallet — macOS only (uses Secure Enclave / Apple crypto APIs)
  # ─────────────────────────────────────────────────────────────────
  agwallet:
    name: AGWallet · Build & Test
    runs-on: macos-15

    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.SUBMODULES_READ_TOKEN }}

      - name: Select Xcode
        run: |
          # Pin to Xcode 16.4 (bundles Swift 6.3) — matches local toolchain
          sudo xcode-select -s /Applications/Xcode_16.4.app
          swift --version

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            AGWallet/.build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: spm-agwallet-${{ runner.os }}-v3-${{ hashFiles('AGWallet/Package.resolved') }}
          restore-keys: spm-agwallet-${{ runner.os }}-v3-

      - name: Resolve dependencies
        working-directory: AGWallet
        run: swift package resolve

      - name: Build (strict concurrency)
        working-directory: AGWallet
        run: |
          swift build -Xswiftc -strict-concurrency=complete 2>&1 \
            | grep -v "^/.*solana-swift-concurrency\|^/.*web3swift-concurrency" || true
          swift build -Xswiftc -strict-concurrency=complete

      - name: Test (XUnit output)
        id: agwallet_test
        working-directory: AGWallet
        run: |
          mkdir -p .test-results
          swift test --parallel \
            --xunit-output .test-results/agwallet.xml \
            2>&1 | tee .test-results/agwallet-raw.log
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agwallet-test-results
          path: AGWallet/.test-results/
          retention-days: 14

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: AGWallet Tests
          path: AGWallet/.test-results/agwallet.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Emit job summary
        if: always()
        working-directory: AGWallet
        run: |
          echo "## 🔐 AGWallet Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f .test-results/agwallet-raw.log ]; then
            PASSED=$(awk '/Test Case.*passed/{c++} END{print c+0}' .test-results/agwallet-raw.log 2>/dev/null || echo 0)
            FAILED=$(awk '/Test Case.*failed/{c++} END{print c+0}' .test-results/agwallet-raw.log 2>/dev/null || echo 0)
            TOTAL=$((PASSED + FAILED))
            echo "| Result | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | ${PASSED} / ${TOTAL} |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | ${FAILED} / ${TOTAL} |" >> $GITHUB_STEP_SUMMARY
            if [ "$FAILED" -gt 0 ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Failed Tests" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep "Test Case.*failed" .test-results/agwallet-raw.log >> $GITHUB_STEP_SUMMARY || true
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..10}; do
            if pg_isready               --host 127.0.0.1               --port 5432               --username postgres               --dbname postgres; then
              echo "PostgreSQL is ready."
              exit 0
            fi

            echo "Waiting for PostgreSQL... ${attempt}/10"
            sleep 2
          done

          echo "PostgreSQL did not become ready in time." >&2
          exit 1
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.SUBMODULES_READ_TOKEN }}

      - name: Trust repo directory (git safe.directory)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache SPM (Linux)
        uses: actions/cache@v4
        with:
          path: |
            AetherAG/.build
            ~/.cache/org.swift.swiftpm
          key: spm-aether-linux-v3-${{ hashFiles('AetherAG/Package.resolved') }}
          restore-keys: spm-aether-linux-v3-


      - name: Linux pre-flight check
        run: bash scripts/linux-preflight.sh

      - name: Resolve dependencies
        working-directory: AetherAG
        run: swift package resolve

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Wait for PostgreSQL
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..10}; do
            if pg_isready               --host 127.0.0.1               --port 5432               --username postgres               --dbname postgres; then
              echo "PostgreSQL is ready."
              exit 0
            fi

            echo "Waiting for PostgreSQL... ${attempt}/10"
            sleep 2
          done

          echo "PostgreSQL did not become ready in time." >&2
          exit 1
      - name: Wait for Redis to be ready
        run: |
          apt-get update -q
          apt-get install -y -q redis-tools
          for i in $(seq 1 10); do
            redis-cli -h redis -p 6379 ping && exit 0
            echo "Waiting for Redis... $i/10"
            sleep 3
          done
          echo "Redis did not become ready."
          exit 1

      - name: Build
        working-directory: AetherAG
        run: swift build --configuration debug

      - name: Test — all suites (XUnit output)
        id: aether_linux_test
        working-directory: AetherAG
        run: |
          mkdir -p .test-results
          swift test --parallel \
            --xunit-output .test-results/aether-linux.xml \
            2>&1 | tee .test-results/aether-linux-raw.log
        continue-on-error: true

      - name: Test — Persistence / Issuance (XUnit output)
        id: aether_linux_persistence_test
        working-directory: AetherAG
        run: |
          swift test --filter PersistenceIssuanceTests --parallel \
            --xunit-output .test-results/aether-linux-persistence.xml \
            2>&1 | tee -a .test-results/aether-linux-raw.log
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-linux-test-results
          path: AetherAG/.test-results/
          retention-days: 14

      - name: Detect AetherAG Linux JUnit report
        if: always()
        id: aether_linux_junit
        shell: bash
        run: |
          shopt -s nullglob
          reports=(AetherAG/.test-results/aether-linux*.xml)
          if ((${#reports[@]})); then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No AetherAG Linux JUnit XML report was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish test report
        if: always() && steps.aether_linux_junit.outputs.present == 'true'
        uses: dorny/test-reporter@v2
        with:
          name: AetherAG Linux Tests
          path: AetherAG/.test-results/aether-linux*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Emit job summary
        if: always()
        working-directory: AetherAG
        run: |
          echo "## 🌐 AetherAG Linux (Vapor) Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f .test-results/aether-linux-raw.log ]; then
            PASSED=$(awk '/Test Case.*passed/{c++} END{print c+0}' .test-results/aether-linux-raw.log 2>/dev/null || echo 0)
            FAILED=$(awk '/Test Case.*failed/{c++} END{print c+0}' .test-results/aether-linux-raw.log 2>/dev/null || echo 0)
            TOTAL=$((PASSED + FAILED))
            echo "| Result | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | ${PASSED} / ${TOTAL} |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | ${FAILED} / ${TOTAL} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Suites run:** All · PersistenceIssuanceTests" >> $GITHUB_STEP_SUMMARY
            if [ "$FAILED" -gt 0 ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Failed Tests" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep "Test Case.*failed" .test-results/aether-linux-raw.log >> $GITHUB_STEP_SUMMARY || true
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Fail job if tests failed
        if: >
          steps.aether_linux_test.outcome == 'failure' ||
          steps.aether_linux_persistence_test.outcome == 'failure'
        run: exit 1

  # ─────────────────────────────────────────────────────────────────
  # AetherAG — macOS (client + server, needs AGWallet green first)
  # ─────────────────────────────────────────────────────────────────
  aether-macos:
    name: AetherAG · macOS Build & Test
    runs-on: macos-15
    needs: agwallet

    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.SUBMODULES_READ_TOKEN }}

      - name: Select Xcode
        run: |
          # Pin to Xcode 16.4 (bundles Swift 6.3) — matches local toolchain
          sudo xcode-select -s /Applications/Xcode_16.4.app
          swift --version

      - name: Cache SPM (macOS)
        uses: actions/cache@v4
        with:
          path: |
            AetherAG/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-aether-macos-${{ runner.os }}-v3-${{ hashFiles('AetherAG/Package.resolved') }}
          restore-keys: spm-aether-macos-${{ runner.os }}-v3-

      - name: Resolve dependencies
        working-directory: AetherAG
        run: swift package resolve

      - name: Clean build artifacts
        working-directory: AetherAG
        run: rm -rf .build

      - name: Build
        working-directory: AetherAG
        run: swift build --configuration debug

      - name: Test (XUnit output)
        id: aether_macos_test
        working-directory: AetherAG
        run: |
          mkdir -p .test-results
          swift test --parallel \
            --xunit-output .test-results/aether-macos.xml \
            2>&1 | tee .test-results/aether-macos-raw.log
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-macos-test-results
          path: AetherAG/.test-results/
          retention-days: 14

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: AetherAG macOS Tests
          path: AetherAG/.test-results/aether-macos.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Emit job summary
        if: always()
        working-directory: AetherAG
        run: |
          echo "## 🍎 AetherAG macOS Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f .test-results/aether-macos-raw.log ]; then
            PASSED=$(awk '/Test Case.*passed/{c++} END{print c+0}' .test-results/aether-macos-raw.log 2>/dev/null || echo 0)
            FAILED=$(awk '/Test Case.*failed/{c++} END{print c+0}' .test-results/aether-macos-raw.log 2>/dev/null || echo 0)
            TOTAL=$((PASSED + FAILED))
            echo "| Result | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | ${PASSED} / ${TOTAL} |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | ${FAILED} / ${TOTAL} |" >> $GITHUB_STEP_SUMMARY
            if [ "$FAILED" -gt 0 ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### Failed Tests" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep "Test Case.*failed" .test-results/aether-macos-raw.log >> $GITHUB_STEP_SUMMARY || true
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Fail job if tests failed
        if: steps.aether_macos_test.outcome == 'failure'
        run: exit 1

  # ─────────────────────────────────────────────────────────────────
  # Secret scanning (TruffleHog — verified secrets only)
  # ─────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified
