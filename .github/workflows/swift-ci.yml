name: Swift CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: swift-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-guardrails:
    name: Production Guardrails
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_READ_TOKEN }}
          fetch-depth: 0

      - name: Check Python migration guardrails
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/check_test_reports.py
          python3 -m unittest discover -s scripts/tests -p 'test*.py' -v

      - name: Run production diagnostics
        run: |
          set -euo pipefail
          bash scripts/local/run-production-diagnostics.sh

      - name: Upload production diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-diagnostics
          path: .artifacts/production-diagnostics/
          if-no-files-found: warn
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────
  # AGWallet — macOS only (uses Secure Enclave / Apple crypto APIs)
  # ─────────────────────────────────────────────────────────────────
  agwallet:
    name: AGWallet · Build & Test
    runs-on: macos-15

    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_READ_TOKEN }}
          fetch-depth: 0

      - name: Select Xcode
        run: |
          # Pin to Xcode 26.3 so CI uses a Swift 6.2-or-newer toolchain.
          xcode_path="/Applications/Xcode_26.3.app"
          if [ ! -d "$xcode_path" ]; then
            echo "Required Xcode installation is unavailable: $xcode_path" >&2
            for installed_xcode in /Applications/Xcode*; do
              [ -e "$installed_xcode" ] || continue
              printf '%s\n' "${installed_xcode##*/}"
            done
            exit 1
          fi
          sudo xcode-select -s "$xcode_path"
          swift_output="$(swift --version)"
          printf '%s\n' "$swift_output"
          swift_version="$(
            printf '%s\n' "$swift_output" |
              sed -nE \
                -e 's/^Apple Swift version ([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/p' \
                -e 's/.*swiftlang-([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/p' |
              head -n 1
          )"
          IFS='.' read -r major minor _patch <<< "${swift_version:-0.0.0}"
          if ! [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ ]]; then
            echo "Unable to parse Swift version from: ${swift_version:-unknown}" >&2
            exit 1
          fi
          printf 'Parsed Swift version: %s\n' "$swift_version"
          if (( major < 6 || (major == 6 && minor < 2) )); then
            echo "Swift 6.2 or later is required; found: $swift_version" >&2
            exit 1
          fi
          echo "Swift version guard passed."

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: |
            AGWallet/.build
            ~/.cache/org.swift.swiftpm
            ~/Library/Caches/org.swift.swiftpm
          key: spm-agwallet-${{ runner.os }}-v3-${{ hashFiles('AGWallet/Package.resolved') }}
          restore-keys: spm-agwallet-${{ runner.os }}-v3-

      - name: Resolve dependencies
        working-directory: AGWallet
        run: swift package resolve

      - name: Build (strict concurrency)
        working-directory: AGWallet
        run: |
          swift build -Xswiftc -strict-concurrency=complete 2>&1 \
            | grep -v "^/.*solana-swift-concurrency\|^/.*web3swift-concurrency" || true
          swift build -Xswiftc -strict-concurrency=complete

      - name: Test (XUnit output)
        id: agwallet_test
        working-directory: AGWallet
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .test-results
          swift test --parallel \
            --xunit-output .test-results/agwallet.xml \
            2>&1 | tee .test-results/agwallet-raw.log
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agwallet-test-results
          path: AGWallet/.test-results/
          retention-days: 14

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: AGWallet Tests
          path: AGWallet/.test-results/agwallet*.xml
          reporter: java-junit
          fail-on-error: true
          fail-on-empty: true

      - name: Emit job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_test_reports.py \
            --directory AGWallet/.test-results \
            --title 'AGWallet test results' \
            --group 'agwallet:agwallet*.xml'

      - name: Fail job if tests failed
        if: always() && steps.agwallet_test.outcome == 'failure'
        run: exit 1

  # ─────────────────────────────────────────────────────────────────
  # AetherAG — Linux (Vapor/Fluent backend)
  # ─────────────────────────────────────────────────────────────────
  aether-linux:
    name: AetherAG · Linux Build & Test
    runs-on: ubuntu-latest

    permissions:
      checks: write
      pull-requests: write
      contents: read
    container:
      image: docker.io/library/swift@sha256:119ff7d833ea622851b459513333bb4bda5ebb32b7acd05dd05077d5b0383129

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vapor_username
          POSTGRES_PASSWORD: vapor_password
          POSTGRES_DB: vapor_database
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://vapor_username:vapor_password@postgres:5432/vapor_database
      REDIS_URL: redis://redis:6379/15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_READ_TOKEN }}
          fetch-depth: 0

      - name: Trust repo directory (git safe.directory)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache SPM (Linux)
        uses: actions/cache@v4
        with:
          path: |
            AetherAG/.build
            ~/.cache/org.swift.swiftpm
          key: spm-aether-linux-swift642-v1-${{ hashFiles('AetherAG/Package.resolved') }}
          restore-keys: spm-aether-linux-swift642-v1-


      - name: Install Python for Linux test summary
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v python3 >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends python3
          fi
          python3 --version
          python3 -c 'import xml.etree.ElementTree'

      - name: Linux pre-flight check
        run: bash scripts/linux-preflight.sh

      - name: Resolve dependencies
        working-directory: AetherAG
        run: swift package resolve

      - name: Wait for Postgres to be ready
        run: |
          apt-get install -y -q postgresql-client 2>/dev/null || true
          for i in $(seq 1 10); do
            pg_isready -h postgres -U vapor_username -d vapor_database && break
            echo "Waiting for postgres... $i/10"
            sleep 3
          done

      - name: Wait for Redis to be ready
        run: |
          apt-get update -q
          apt-get install -y -q redis-tools
          for i in $(seq 1 10); do
            redis-cli -h redis -p 6379 ping && exit 0
            echo "Waiting for Redis... $i/10"
            sleep 3
          done
          echo "Redis did not become ready."
          exit 1

      - name: Build Linux-compatible server products
        working-directory: AetherAG
        run: |
          # The AetherAG target contains Apple-only SwiftUI views.
          # Linux CI validates the shared, client-core, and Vapor server graph.
          swift build --product AetherAGMailServerRun --configuration debug

      - name: Test Linux-compatible suites (XUnit output)
        id: aether_linux_test
        working-directory: AetherAG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .test-results
          swift test --filter AetherAGMailSharedTests --parallel \
            --xunit-output .test-results/aether-linux-shared.xml \
            2>&1 | tee .test-results/aether-linux-raw.log
          swift test --filter AetherAGMailServerTests --parallel \
            --xunit-output .test-results/aether-linux-server.xml \
            2>&1 | tee -a .test-results/aether-linux-raw.log
          swift test --filter FlowTests --parallel \
            --xunit-output .test-results/aether-linux-flow.xml \
            2>&1 | tee -a .test-results/aether-linux-raw.log
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-linux-test-results
          path: AetherAG/.test-results/
          retention-days: 14

      - name: Detect AetherAG Linux JUnit report
        if: always()
        id: aether_linux_junit
        shell: bash
        run: |
          shopt -s nullglob
          reports=(AetherAG/.test-results/aether-linux*.xml)
          if ((${#reports[@]})); then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No AetherAG Linux JUnit XML report was generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish test report
        if: always() && steps.aether_linux_junit.outputs.present == 'true'
        uses: dorny/test-reporter@v2
        with:
          name: AetherAG Linux Tests
          path: AetherAG/.test-results/aether-linux*.xml
          reporter: java-junit
          fail-on-error: true

      - name: Emit job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_test_reports.py \
            --directory AetherAG/.test-results \
            --title 'AetherAG Linux test results' \
            --group 'shared:aether-linux-shared*.xml' \
            --group 'server:aether-linux-server*.xml' \
            --group 'flow:aether-linux-flow*.xml'

      - name: Fail job if tests failed
        if: always() && steps.aether_linux_test.outcome == 'failure'
        run: exit 1

  # ─────────────────────────────────────────────────────────────────
  # AetherAG — macOS (client + server, needs AGWallet green first)
  # ─────────────────────────────────────────────────────────────────
  aether-macos:
    name: AetherAG · macOS Build & Test
    runs-on: macos-15
    needs: agwallet

    permissions:
      checks: write
      pull-requests: write
      contents: read

    env:
      DATABASE_URL: postgres://test:test@127.0.0.1:15432/test
      REDIS_URL: redis://127.0.0.1:16379/15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULES_READ_TOKEN }}
          fetch-depth: 0

      - name: Select Xcode
        run: |
          # Pin to Xcode 26.3 so CI uses a Swift 6.2-or-newer toolchain.
          xcode_path="/Applications/Xcode_26.3.app"
          if [ ! -d "$xcode_path" ]; then
            echo "Required Xcode installation is unavailable: $xcode_path" >&2
            for installed_xcode in /Applications/Xcode*; do
              [ -e "$installed_xcode" ] || continue
              printf '%s\n' "${installed_xcode##*/}"
            done
            exit 1
          fi
          sudo xcode-select -s "$xcode_path"
          swift_output="$(swift --version)"
          printf '%s\n' "$swift_output"
          swift_version="$(
            printf '%s\n' "$swift_output" |
              sed -nE \
                -e 's/^Apple Swift version ([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/p' \
                -e 's/.*swiftlang-([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/p' |
              head -n 1
          )"
          IFS='.' read -r major minor _patch <<< "${swift_version:-0.0.0}"
          if ! [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ ]]; then
            echo "Unable to parse Swift version from: ${swift_version:-unknown}" >&2
            exit 1
          fi
          printf 'Parsed Swift version: %s\n' "$swift_version"
          if (( major < 6 || (major == 6 && minor < 2) )); then
            echo "Swift 6.2 or later is required; found: $swift_version" >&2
            exit 1
          fi
          echo "Swift version guard passed."

      - name: Cache SPM (macOS)
        uses: actions/cache@v4
        with:
          path: |
            AetherAG/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-aether-macos-${{ runner.os }}-v3-${{ hashFiles('AetherAG/Package.resolved') }}
          restore-keys: spm-aether-macos-${{ runner.os }}-v3-

      - name: Start isolated macOS test services
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          for formula in postgresql@16 redis; do
            if ! brew list --versions "$formula" >/dev/null 2>&1; then
              HOMEBREW_NO_AUTO_UPDATE=1 brew install "$formula"
            fi
          done

          pg_bin="$(brew --prefix postgresql@16)/bin"
          redis_bin="$(brew --prefix redis)/bin"
          service_dir="$RUNNER_TEMP/aether-ci-services"

          if [[ -e "$service_dir" ]]; then
            echo "Service directory unexpectedly exists." >&2
            exit 1
          fi

          for port in 15432 16379; do
            if lsof -nP -iTCP:"$port" -sTCP:LISTEN >/dev/null 2>&1; then
              echo "Required test port is already occupied: $port" >&2
              exit 1
            fi
          done

          mkdir -p "$service_dir/socket" "$service_dir/redis"
          printf '%s\n' "$pg_bin" > "$service_dir/postgres-bin"

          "$pg_bin/initdb" \
            -D "$service_dir/postgres" \
            --username=test \
            --auth-local=trust \
            --auth-host=trust \
            --encoding=UTF8 \
            --no-locale

          "$pg_bin/pg_ctl" \
            -D "$service_dir/postgres" \
            -l "$service_dir/postgres.log" \
            -o "-h 127.0.0.1 -p 15432 -k $service_dir/socket" \
            -w -t 60 start

          "$pg_bin/createdb" \
            -h 127.0.0.1 -p 15432 -U test test

          "$redis_bin/redis-server" \
            --bind 127.0.0.1 \
            --protected-mode yes \
            --port 16379 \
            --save "" \
            --appendonly no \
            --daemonize yes \
            --dir "$service_dir/redis" \
            --pidfile "$service_dir/redis.pid" \
            --logfile "$service_dir/redis.log"

          ready=false
          for attempt in $(seq 1 30); do
            printf 'Waiting for Redis readiness: %s/30\n' "$attempt"
            if [[ "$("$redis_bin/redis-cli" -h 127.0.0.1 -p 16379 ping 2>/dev/null)" = PONG ]]; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "Redis readiness timed out." >&2
            exit 1
          fi

          "$pg_bin/psql" \
            -h 127.0.0.1 -p 15432 -U test -d test \
            -v ON_ERROR_STOP=1 -c 'SELECT 1;'

          echo "Dedicated PostgreSQL and Redis test services are ready."

      - name: Resolve dependencies
        working-directory: AetherAG
        run: swift package resolve

      - name: Clean build artifacts
        working-directory: AetherAG
        run: rm -rf .build

      - name: Build
        working-directory: AetherAG
        run: swift build --configuration debug

      - name: Test (XUnit output)
        id: aether_macos_test
        working-directory: AetherAG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .test-results
          swift test --parallel \
            --xunit-output .test-results/aether-macos.xml \
            2>&1 | tee .test-results/aether-macos-raw.log
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-macos-test-results
          path: AetherAG/.test-results/
          retention-days: 14

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: AetherAG macOS Tests
          path: AetherAG/.test-results/aether-macos*.xml
          reporter: java-junit
          fail-on-error: true
          fail-on-empty: true

      - name: Emit job summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_test_reports.py \
            --directory AetherAG/.test-results \
            --title 'AetherAG macOS test results' \
            --group 'macos:aether-macos*.xml'

      - name: Fail job if tests failed
        if: always() && steps.aether_macos_test.outcome == 'failure'
        run: exit 1

      - name: Stop isolated macOS test services
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          service_dir="$RUNNER_TEMP/aether-ci-services"
          result=0

          if [[ -f "$service_dir/redis.pid" ]]; then
            pid="$(cat "$service_dir/redis.pid")"
            if [[ "$pid" =~ ^[0-9]+$ ]] && kill -0 "$pid" 2>/dev/null; then
              kill -TERM "$pid" || result=1
            fi
          fi

          if [[ -f "$service_dir/postgres-bin" && -f "$service_dir/postgres/postmaster.pid" ]]; then
            pg_bin="$(cat "$service_dir/postgres-bin")"
            "$pg_bin/pg_ctl" \
              -D "$service_dir/postgres" \
              -m fast -w -t 60 stop || result=1
          fi

          exit "$result"


  # ─────────────────────────────────────────────────────────────────
  # Secret scanning (TruffleHog — verified secrets only)
  # ─────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified
