name: AGWallet Build & Test
permissions:
  contents: read


on:
  push:
    paths:
      - 'AGWallet/**'
      - '.github/workflows/agwallet-build.yml'
  pull_request:
    paths:
      - 'AGWallet/**'
      - '.github/workflows/agwallet-build.yml'

jobs:
  build-and-test:
    runs-on: xcode-27
    defaults:
      run:
        working-directory: AGWallet
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive


      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run unit tests (excludes live-network integration tests)
        run: swift test --filter '.*' 2>&1 | tee test-output.log
        env:
          FLOW_TESTNET_INTEGRATION: "0"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: AGWallet/test-output.log
